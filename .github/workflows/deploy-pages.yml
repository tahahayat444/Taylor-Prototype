name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build all game apps
        run: |
          mkdir -p dist/apps dist/fonts

          build_app() {
            app_dir="$1"
            app_slug="$2"
            (
              cd "$app_dir"
              pnpm install --frozen-lockfile
              pnpm exec vite build --base=./ --outDir="../dist/apps/$app_slug" --emptyOutDir
              cp ../fonts/OFL.txt "../dist/apps/$app_slug/OFL.txt"
            )
          }

          build_app "Opening Screen" opening
          build_app "Saftey Check" safety-check
          build_app "Stick and Fix" stick-and-fix
          build_app "Dress Up" dress-up
          build_app "Clean Up" clean-up
          build_app "Morning Clense" morning-cleanse

          cp fonts/nunito-latin-variable.woff2 fonts/OFL.txt dist/fonts/
          cp index.html dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
